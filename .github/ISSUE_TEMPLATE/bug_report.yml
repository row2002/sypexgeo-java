name: Bug report
description: A wrong answer, an exception or another problem with the library
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Wrong data for an IP is usually a database matter: please check it at https://sypexgeo.net/ first.
        Можно писать по-русски.
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Database
      description: Output of `geo.info()` (build date, edition, charset) and the file name.
      placeholder: "DbInfo[version=2.2, created=2026-08-12T00:00:00Z, type=SxGeo City EN, charset=UTF-8, hasCities=true, ipBlocks=...]  SxGeoCity.dat"
      render: text
    validations:
      required: true
  - type: input
    id: ip
    attributes:
      label: IP address
      description: The address (or the string) you passed to the library.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What the library returned, or the exception with its stack trace.
      render: text
    validations:
      required: true
  - type: input
    id: java
    attributes:
      label: Java version and OS
      placeholder: "Temurin 21, Linux"
