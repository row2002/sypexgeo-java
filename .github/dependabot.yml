version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    ignore:
      # pinned: 0.35+ needs Gradle 9
      - dependency-name: "com.vanniktech.maven.publish*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # gradle/actions v6+ switches to proprietary caching by default; stay on v5 (open-source caching)
      - dependency-name: "gradle/actions*"
        update-types: ["version-update:semver-major"]
