name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build (compile, tests, javadoc, jars)
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}
      # JitPack builds the tag by itself (com.github.row2002); Maven Central (io.github.row2002) only when configured
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_mavenCentralPassword" ] \
              || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::notice::Maven Central secrets are not set: skipping the publication (see RELEASING.md)"
            exit 0
          fi
          ./gradlew publishAndReleaseToMavenCentral -Pversion=${{ steps.version.outputs.version }}
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^(## )?\[/ { exit } on { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md; fi
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME}" --notes-file notes.md build/libs/*.jar
