name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Downloads the real databases at most once a month (per branch cache scope) and caches them for the build jobs.
  testdata:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: echo "key=sypexgeo-testdata-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v5
        with:
          path: testdata
          key: ${{ steps.key.outputs.key }}
      - name: Download Sypex Geo databases
        id: download
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true # without the databases the integration tests are skipped, the rest still runs
        run: |
          rm -rf testdata && mkdir -p testdata
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/country.zip" https://sypexgeo.net/files/SxGeoCountry.zip
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/city.zip" https://sypexgeo.net/files/SxGeoCity_utf8.zip
          unzip -o "$RUNNER_TEMP/country.zip" -d testdata
          unzip -o "$RUNNER_TEMP/city.zip" -d testdata
          test -s testdata/SxGeo.dat && test -s testdata/SxGeoCity.dat
      - name: Warn about missing databases
        if: steps.download.outcome == 'failure'
        run: echo "::warning::Sypex Geo databases could not be downloaded, integration tests are skipped"
      - name: Save Sypex Geo databases
        if: steps.download.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: testdata
          key: ${{ steps.key.outputs.key }}

  build:
    needs: testdata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # caches Gradle (open-source actions/cache based caching; v6 defaults to a proprietary one) and validates the wrapper jar
      - uses: gradle/actions/setup-gradle@v5
      # restore only: a cache miss (download failed) leaves testdata/ absent and the integration tests are skipped
      - uses: actions/cache/restore@v5
        with:
          path: testdata
          key: ${{ needs.testdata.outputs.key }}
      - name: Build (compile, tests, javadoc, jars)
        run: ./gradlew build
